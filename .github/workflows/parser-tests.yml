name: Fly-in parser checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "pydantic>=2,<3"
      - name: Test bundled maps and CLI
        run: python -m pytest -q input/tests/test_map_parsing.py tests/test_cli.py tests/test_movement_invariants.py
