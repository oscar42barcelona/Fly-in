name: Fly-in parser checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "pydantic>=2,<3" "plotly>=6,<7" "streamlit>=1.50,<2"
      - name: Test bundled maps and CLI
        run: python -m pytest -q -s input/tests/test_map_parsing.py tests/test_cli.py tests/test_movement_invariants.py tests/test_plotly_graph.py tests/test_plotly_playback.py tests/test_streamlit_metrics.py

  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "pydantic>=2,<3"
      - name: Test parsing, unusual maps, capacities and Ctrl+C
        run: |
          python -m pytest -q -s \
            tests/test_parser_adversarial.py \
            tests/test_cli_interruptions.py \
            tests/test_architecture.py \
            tests/test_simulation_progress.py \
            tests/test_unseen_maps.py \
            tests/test_movement_invariants.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint and type-check dependencies
        run: |
          python -m pip install "flake8>=7,<8" "mypy>=1.15,<2"
          python -m pip install "pydantic>=2,<3" "plotly>=6,<7" "streamlit>=1.50,<2"
      - name: Flake8 (whole repository)
        run: flake8 .
      - name: Mypy (subject-required flags)
        if: always()
        run: |
          mypy . --warn-return-any --warn-unused-ignores \
            --ignore-missing-imports --disallow-untyped-defs \
            --check-untyped-defs

  interface_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install interface dependencies
        run: |
          python -m pip install "flake8>=7,<8" "mypy>=1.15,<2"
          python -m pip install "pydantic>=2,<3" "plotly>=6,<7" "streamlit>=1.50,<2"
      - name: Flake8 - interface and visualization
        run: |
          flake8 ui/interface/app.py ui/interface/turn_view.py \
            ui/visualizer/simulation_service.py \
            ui/visualizer/turn_positions.py ui/visualizer/plotly_test.py
      - name: Mypy - interface and visualization
        if: always()
        run: |
          mypy ui/interface/app.py ui/interface/turn_view.py \
            ui/visualizer/simulation_service.py \
            ui/visualizer/turn_positions.py ui/visualizer/plotly_test.py \
            --follow-imports=silent --warn-return-any \
            --warn-unused-ignores --ignore-missing-imports \
            --disallow-untyped-defs --check-untyped-defs

  subject_benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchmark dependencies
        run: python -m pip install "pytest>=8,<10" "pydantic>=2,<3"
      - name: Check nine mandatory maps against 125% turn limits
        run: python -m pytest -q -s tests/test_subject_benchmarks.py

  submission_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create project-local virtual environment
        run: python -m venv .venv
      - name: Install from the repository's dependency manifest
        run: make install
      - name: Validate Makefile lint inside the local virtual environment
        run: make lint
      - name: Execute the required Makefile run target
        run: |
          make run MAP=maps/easy/01_linear_path.txt > /tmp/flyin_run.txt
          test "$(wc -l < /tmp/flyin_run.txt)" -eq 4
          grep -q '^D2-goal$' /tmp/flyin_run.txt
      - name: Check cleanup removes generated HTML but retains venv
        run: |
          touch flyin_preview.html
          make clean
          test ! -e flyin_preview.html
          test -x .venv/bin/python
      - name: Confirm the mandatory English README header
        run: |
          python - <<'PY'
          from pathlib import Path
          readme = Path("README.md").read_text(encoding="utf-8")
          first = readme.splitlines()[0]
          assert first == (
              "*This project has been created as part of "
              "the 42 curriculum by osuarez-*"
          )
          for section in (
              "## Description", "## Instructions",
              "## Resources", "## Algorithm choices",
          ):
              assert section in readme, section
          PY
