name: Fly-in parser checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "pydantic>=2,<3" "plotly>=6,<7" "streamlit>=1.50,<2"
      - name: Test bundled maps and CLI
        run: python -m pytest -q -s input/tests/test_map_parsing.py tests/test_cli.py tests/test_movement_invariants.py tests/test_plotly_graph.py tests/test_plotly_playback.py tests/test_streamlit_metrics.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint and type-check dependencies
        run: |
          python -m pip install "flake8>=7,<8" "mypy>=1.15,<2"
          python -m pip install "pydantic>=2,<3" "plotly>=6,<7" "streamlit>=1.50,<2"
      - name: Flake8 (whole repository)
        run: flake8 .
      - name: Mypy (subject-required flags)
        if: always()
        run: |
          mypy . --warn-return-any --warn-unused-ignores \
            --ignore-missing-imports --disallow-untyped-defs \
            --check-untyped-defs
